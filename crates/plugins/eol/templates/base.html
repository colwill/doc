<div id="eol">
  <nav class="doc-tabs" aria-label="End of life">
    <ul class="doc-tabs__list">
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="{{ frame.overview() }}"{% if frame.tab == "overview" %} aria-current="page"{% endif %}>Overview</a></li>
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="{{ frame.products() }}"{% if frame.tab == "products" || frame.tab == "product" %} aria-current="page"{% endif %}>Products in use</a></li>
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="{{ frame.all() }}"{% if frame.tab == "all" %} aria-current="page"{% endif %}>All products</a></li>
    </ul>
  </nav>
  <h2>{{ frame.heading }}</h2>
  {%- block main %}{% endblock %}
</div>
