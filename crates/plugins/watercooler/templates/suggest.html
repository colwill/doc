{%- for choice in choices %}
<li><button type="button" class="doc-suggest__option" tabindex="-1" data-value="{{ choice.value }}">{{ choice.name }} <span class="doc-hint">{{ choice.hint }}</span></button></li>
{%- endfor %}
{%- if !note.is_empty() %}
<li class="doc-suggest__empty">{{ note }}</li>
{%- endif %}
