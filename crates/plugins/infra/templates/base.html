<div id="infra">
  <nav class="doc-tabs" aria-label="Infrastructure">
    <ul class="doc-tabs__list">
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/infra/development"{% block tab_development %}{% endblock %}>Development</a></li>
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/infra/production"{% block tab_production %}{% endblock %}>Production</a></li>
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/infra/templates"{% block tab_templates %}{% endblock %}>Templates</a></li>
    </ul>
  </nav>
  {%- if let Some(notice) = flash.notice %}
  <div class="doc-card"><div class="doc-card__content"><p>{{ notice }}</p></div></div>
  {%- endif %}
  {%- if let Some(error) = flash.error %}
  <p class="doc-error-message" role="alert"><span>That was refused:</span> {{ error }}</p>
  {%- endif %}
  {%- block main %}{% endblock %}
</div>
