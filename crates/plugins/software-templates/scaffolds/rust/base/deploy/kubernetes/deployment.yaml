apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ values.name }}
  labels:
    app.kubernetes.io/name: {{ values.name }}
    app.kubernetes.io/part-of: {{ values.team | name | default('platform') }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ values.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ values.name }}
          image: {{ values.name }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
{% for one in env %}            - name: {{ one.name }}
              value: "{{ one.value }}"
{% endfor %}            - name: RUST_LOG
              value: "info"
            - name: DOC_FLAGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ values.name }}-doc
                  key: flags-token
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
