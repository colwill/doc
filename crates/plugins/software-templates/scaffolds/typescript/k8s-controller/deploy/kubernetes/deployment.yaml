apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ values.name }}
  labels:
    app.kubernetes.io/name: {{ values.name }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ values.name }}
    spec:
      serviceAccountName: {{ values.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ values.name }}:latest
          imagePullPolicy: IfNotPresent
          env:
{% for one in env %}            - name: {{ one.name }}
              value: "{{ one.value }}"
{% endfor %}            - name: NODE_ENV
              value: "production"
            - name: DOC_FLAGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ values.name }}-doc
                  key: flags-token
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
