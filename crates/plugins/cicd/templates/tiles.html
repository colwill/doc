<div class="doc-stat-group">
  {%- for tile in tiles %}
  <div class="doc-stat">
    <span class="doc-stat__label">{{ tile.label }}</span>
    <span class="doc-stat__value">{{ tile.value }}</span>
    {%- if let Some(band) = tile.band %}
    <span class="doc-stat__note"><strong class="doc-badge doc-badge--{{ band.badge() }}">{{ band.word() }}</strong></span>
    {%- endif %}
    <span class="doc-stat__note">{{ tile.note }}</span>
  </div>
  {%- endfor %}
</div>
