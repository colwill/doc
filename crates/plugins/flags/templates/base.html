<div id="flags">
  <nav class="doc-tabs" aria-label="Feature flags">
    <ul class="doc-tabs__list">
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/flags/"{% block tab_flags %}{% endblock %}>Flags</a></li>
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/flags/config"{% block tab_config %}{% endblock %}>Configuration</a></li>
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/flags/providers"{% block tab_providers %}{% endblock %}>Providers</a></li>
    </ul>
  </nav>
  {%- if let Some(notice) = flash.notice %}
  <div class="doc-card"><div class="doc-card__content"><p>{{ notice }}</p></div></div>
  {%- endif %}
  {%- if let Some(error) = flash.error %}
  <p class="doc-error-message" role="alert"><span>That was refused:</span> {{ error }}</p>
  {%- endif %}
  {%- block main %}{% endblock %}
</div>
