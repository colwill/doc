<div class="doc-stat-group">
  {%- for tile in tiles %}
  <div class="doc-stat">
    <span class="doc-stat__label">{{ tile.label }}</span>
    <span class="doc-stat__value">{{ tile.value }}</span>
    <span class="doc-stat__note"><strong class="doc-badge doc-badge--{{ tile.verdict.badge() }}">{{ tile.verdict.word() }}</strong></span>
    <span class="doc-stat__note">{{ tile.note }}</span>
  </div>
  {%- endfor %}
</div>
