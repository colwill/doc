<table class="doc-table">
  <thead class="doc-table__head">
    <tr class="doc-table__row">
      <th class="doc-table__header" scope="col">{{ row_kind }}</th>
      <th class="doc-table__header" scope="col">Deployment frequency</th>
      <th class="doc-table__header" scope="col">Change lead time</th>
      <th class="doc-table__header" scope="col">Change fail rate</th>
      <th class="doc-table__header" scope="col">Recovery time</th>
    </tr>
  </thead>
  <tbody class="doc-table__body">
    {%- for row in rows %}
    <tr class="doc-table__row">
      <th class="doc-table__header" scope="row"><a href="{{ row.href }}">{{ row.title }}</a></th>
      {%- for cell in row.cells %}
      <td class="doc-table__cell">{{ cell.value }}{% if let Some(band) = cell.band %} <strong class="doc-badge doc-badge--{{ band.badge() }}">{{ band.word() }}</strong>{% endif %}</td>
      {%- endfor %}
    </tr>
    {%- endfor %}
  </tbody>
</table>
