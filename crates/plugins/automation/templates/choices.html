{%- if found.is_empty() %}
<p class="doc-combo__empty">{{ empty }}</p>
{%- else %}
{%- for item in found %}
<button class="doc-combo__option" type="button" role="option" aria-selected="false" data-value="{{ item.value }}"{% if item.value != item.label %} data-label="{{ item.label }}"{% endif %}>
  <span class="doc-combo__name">{{ item.label }}</span>
  <span class="doc-combo__kind">{{ item.kind }}</span>
  {%- if !item.title.is_empty() %}<span class="doc-combo__title">{{ item.title }}</span>{% endif %}
</button>
{%- endfor %}
{%- if more %}
<p class="doc-combo__empty">Type more of it to narrow it down.</p>
{%- endif %}
{%- endif %}
