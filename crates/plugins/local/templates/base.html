<div id="local">
  <nav class="doc-tabs" aria-label="DOC accounts">
    <ul class="doc-tabs__list">
      {%- if writes %}
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/local/"{% block tab_accounts %}{% endblock %}>Accounts</a></li>
      {%- endif %}
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/local/password"{% block tab_password %}{% endblock %}>Your password</a></li>
    </ul>
  </nav>
  {%- if let Some(notice) = flash.notice %}
  <div class="nhsuk-inset-text"><p>{{ notice }}</p></div>
  {%- endif %}
  {%- if let Some(error) = flash.error %}
  <div class="nhsuk-error-summary" aria-labelledby="local-error" role="alert" tabindex="-1">
    <h2 class="nhsuk-error-summary__title" id="local-error">That was refused</h2>
    <div class="nhsuk-error-summary__body"><p>{{ error }}</p></div>
  </div>
  {%- endif %}
  {%- block main %}{% endblock %}
</div>
