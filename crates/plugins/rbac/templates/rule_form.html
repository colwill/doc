  <div class="doc-form-group">
    <label class="doc-label" for="rule-name">Name</label>
    <input class="doc-input" id="rule-name" name="name" type="text" maxlength="64" value="{{ self.value("name") }}" required />
  </div>
  <div class="doc-form-group">
    <label class="doc-label" for="rule-description">Description</label>
    <input class="doc-input" id="rule-description" name="description" type="text" maxlength="500" value="{{ self.value("description") }}" />
  </div>
  <fieldset class="doc-form-group">
    <legend class="doc-label">Applies when someone signs in and</legend>
    <span class="doc-hint">Leave a condition empty to not check it; a rule with none applies to everyone.</span>
    <label class="doc-label" for="rule-provider">they sign in with</label>
    <input class="doc-input" id="rule-provider" name="provider" type="text" value="{{ self.value("provider") }}" />
    <label class="doc-label" for="rule-organisation">they are in the organisation</label>
    <input class="doc-input" id="rule-organisation" name="organisation" type="text" value="{{ self.value("organisation") }}" />
    <label class="doc-label" for="rule-when">they have the attributes (key=value, key=value)</label>
    <input class="doc-input" id="rule-when" name="when_attributes" type="text" value="{{ self.value("when_attributes") }}" />
  </fieldset>
  <fieldset class="doc-form-group">
    <legend class="doc-label">It gives them</legend>
    {%- if groups.is_empty() %}
    <p class="doc-empty">No groups of users exist yet.</p>
    {%- endif %}
    {%- for group in groups %}
    <div><label class="doc-label"><input type="checkbox" name="group" value="{{ group.plugin }}/{{ group.name }}"{% if self.chosen(group) %} checked{% endif %} /> membership of {{ group.plugin }}/{{ group.name }}</label></div>
    {%- endfor %}
    <label class="doc-label" for="rule-permissions">these permissions, one to a line</label>
    <textarea class="doc-textarea" id="rule-permissions" name="permissions" rows="3">{{ self.value("permissions") }}</textarea>
    <label class="doc-label" for="rule-set">and these attributes where they have none (key=value, key=value)</label>
    <input class="doc-input" id="rule-set" name="set_attributes" type="text" value="{{ self.value("set_attributes") }}" />
  </fieldset>
  <div class="doc-form-group">
    <label class="doc-label"><input type="checkbox" name="enabled" value="yes"{% if self.enabled() %} checked{% endif %} /> In use</label>
  </div>
