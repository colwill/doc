{%- if found.is_empty() %}
<p class="doc-combo__empty">{% if text.is_empty() %}The Catalogue has nothing to choose yet.{% else %}Nothing matches “{{ text }}”.{% endif %}</p>
{%- else %}
{%- for item in found %}
<button class="doc-combo__option" type="button" role="option" aria-selected="false" data-value="{{ item.value }}">
  <span class="doc-combo__name">{{ item.name }}</span>
  <span class="doc-combo__kind">{{ item.kind }}</span>
  {%- if !item.title.is_empty() %}<span class="doc-combo__title">{{ item.title }}</span>{% endif %}
</button>
{%- endfor %}
{%- if more %}
<p class="doc-combo__empty">Type more of the name to narrow it down.</p>
{%- endif %}
{%- endif %}
