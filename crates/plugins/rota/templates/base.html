<div id="rota">
  <nav class="doc-tabs" aria-label="Rotas">
    <ul class="doc-tabs__list">
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/rota/"{% block tab_rotas %}{% endblock %}>Rotas</a></li>
      <li class="doc-tabs__item"><a class="doc-tabs__tab" href="/p/rota/holidays"{% block tab_holidays %}{% endblock %}>Holidays</a></li>
    </ul>
  </nav>
  {%- if let Some(notice) = flash.notice %}
  <div class="doc-card"><div class="doc-card__content"><p>{{ notice }}</p></div></div>
  {%- endif %}
  {%- if let Some(error) = flash.error %}
  <p class="doc-error-message" role="alert"><span>That was refused:</span> {{ error }}</p>
  {%- endif %}
  {%- block main %}{% endblock %}
</div>
