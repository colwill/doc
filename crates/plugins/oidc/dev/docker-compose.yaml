# An OpenID Connect provider to develop against, so the plugin can be tried and its checks run
# without anybody's real identity provider. Keycloak because MVP.md names it, but the plugin
# discovers everything from the issuer, so any provider works the same way.
#
#   just oidc-dev            # start it, with the `doc` realm and two people in it
#   DOC_OIDC_ISSUER=http://127.0.0.1:8090/realms/doc
#   DOC_OIDC_CLIENT_ID=doc-platform
#   DOC_OIDC_CLIENT_SECRET=dev-only-change-me
#
# Its people are `ada` and `grace`, both with the password `dev-only-change-me`.
name: ${DOC_STACK:-doc}-oidc-dev

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-change-me}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${OIDC_BIND:-127.0.0.1}:${OIDC_PORT:-8090}:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
