{%- if rows.is_empty() %}
<p class="doc-empty">Nothing you look after expires in the next month.</p>
{%- else %}
<table class="doc-table">
  <tbody class="doc-table__body">
    {%- for row in rows %}
    <tr class="doc-table__row">
      <th class="doc-table__header" scope="row"><a href="{{ row.href }}">{{ row.title }}</a><br /><span class="doc-hint">{{ row.owner }}</span></th>
      <td class="doc-table__cell">{% if row.gone %}<strong class="doc-badge doc-badge--error">Expired {{ row.expires }}</strong>{% else %}{{ row.expires }}{% endif %}</td>
    </tr>
    {%- endfor %}
  </tbody>
</table>
{%- endif %}
<p><a href="/p/secrets/">Secret Storage</a></p>
