<table class="doc-table">
  <thead class="doc-table__head">
    <tr class="doc-table__row">
      <th class="doc-table__header" scope="col">When</th>
      <th class="doc-table__header" scope="col">Who</th>
      <th class="doc-table__header" scope="col">What</th>
    </tr>
  </thead>
  <tbody class="doc-table__body">
    {%- for happened in history %}
    <tr class="doc-table__row">
      <td class="doc-table__cell">{{ happened.at }}</td>
      <td class="doc-table__cell">{{ happened.by }}</td>
      <td class="doc-table__cell"><strong>{{ happened.action }}</strong>{% if !happened.detail.is_empty() %}: {{ happened.detail }}{% endif %}</td>
    </tr>
    {%- endfor %}
  </tbody>
</table>
