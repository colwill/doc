{% extends "base.html" %}

{% block main %}
<h2>Your token from {{ account.shown() }}</h2>
<div class="nhsuk-warning-callout">
  <h3 class="nhsuk-warning-callout__label"><span role="text"><span class="nhsuk-u-visually-hidden">Important: </span>Copy it now</span></h3>
  <p>It is not shown again, and DOC does not keep it.</p>
</div>
<pre class="doc-code"{% if aws %} data-doc-language="shell"{% endif %}><code>{{ token }}</code></pre>
<p>It carries {{ about }}, and ends {{ expires }}.</p>
<p><a href="{{ account.href() }}?section=tokens">Back to {{ account.shown() }}</a></p>
{% endblock %}
