[notes]
fonts ="nhsuk-frontend's @font-face rules point at https://assets.nhs.uk/fonts/FrutigerLTW01-55Roman and -65Bold (.woff2/.woff). Frutiger is licensed to the NHS and not to us, so it is deliberately not vendored; the declared stack falls back to arial, sans-serif. Montserrat ExtraBold sets the instance name beside the logo; it is OFL-1.1 and its LICENSE is vendored beside it, as that licence requires when the font is redistributed. Montez was an earlier wordmark, Apache-2.0, kept but unused. Only latin subsets are taken, and only .woff2 — every browser we support reads it."
serving = "nhsuk-frontend-10.6.1.min.css resolves its four icons at the absolute path /assets/images/, so nhsuk/ and nhsapp/ have to be served at the site root. Their asset subtrees do not collide."
licences = "Squire's build and Turndown's carry no licence comment of their own, so every editor package's LICENSE is vendored beside its file. They are kept on disk, not served."
source_maps = "The nhsuk, chart.js, Squire and DOMPurify files end in a sourceMappingURL comment. The .map files are not vendored, so devtools will 404 on them; the files are kept byte-identical to upstream rather than edited."
layering = "nhsapp-frontend is a CSS layer on top of nhsuk-frontend, not a replacement: load nhsuk first, then nhsapp."
