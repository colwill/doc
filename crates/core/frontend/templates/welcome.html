{% extends "layout.html" %}

{% block content %}
<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-two-thirds">
    <p class="nhsuk-lede-text">Some plugins act for you with your accounts elsewhere. Link them now, or later from your account page.</p>
    {%- for offer in offered %}
    <div class="doc-card">
      <h2 class="doc-card__heading">{{ offer.name }}</h2>
      <div class="doc-card__content">
        <p>Needed by {{ offer.plugins() }}.</p>
        <form action="/account/links/{{ offer.provider }}" method="post">
          <input type="hidden" name="csrf" value="{{ chrome.csrf }}" />
          <input type="hidden" name="return_to" value="{{ here }}" />
          <button class="doc-button" type="submit">Link your {{ offer.name }} account</button>
        </form>
      </div>
    </div>
    {%- endfor %}
    <p><a href="{{ return_to }}">Skip for now</a></p>
  </div>
</div>
{% endblock %}
