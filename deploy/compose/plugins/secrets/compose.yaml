# Secret Storage: credentials kept once for every plugin, and child tokens from the vendors DOC is
# onboarded to, so it needs to reach them. For a proxied account it holds the credential itself and
# makes every call, which is why it also has a listener of its own on 8460 (ADR-0014).
#
# A deployment of its own, joined to the `doc-system` network and reading the secrets that
# deployment made. Bring `doc-system` up first, then:
#
#   docker compose -f deploy/compose/plugins/secrets/compose.yaml up -d --build
#
# Stopping it stops only this plugin; the platform and every other plugin carry on.
name: ${DOC_STACK:-doc}-secrets

services:
  secrets:
    build:
      context: ../../../..
      dockerfile: crates/core/Dockerfile
      args:
        BIN: doc-secrets
    image: doc/secrets:${PLUGIN_TAG:-dev}
    # On failure only: a version that exits 0 after handing over to a newer one stays stopped.
    restart: on-failure
    # The vendor proxy's own listener, which callers reach directly rather than through core.
    # Nothing answers on it until the `proxy` feature is on. Put a reverse proxy in front of it
    # for TLS; DOC keys are bearer tokens and belong on an encrypted connection.
    ports:
      - "${DOC_PROXY_PORT:-8460}:8460"
    environment:
      DOC_SECRETS_DIR: /secrets
      DOC_BACKEND_QUIC: backend:4433
      DOC_PLUGIN_BIND: 0.0.0.0:4440
      DOC_PLUGIN_ADVERTISE: secrets:4440
      RUST_LOG: ${DOC_PLUGIN_LOG:-info,quiche=warn,tokio_quiche=warn}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
    volumes:
      - secrets:/secrets:ro
    networks: [doc]

volumes:
  # Made by the doc-system deployment's bootstrap job; read-only here.
  secrets:
    name: ${DOC_STACK:-doc}-system-secrets
    external: true

networks:
  doc:
    name: ${DOC_NETWORK:-doc-system}
    external: true
