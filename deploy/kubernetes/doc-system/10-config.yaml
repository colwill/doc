# The platform's configuration and the database's init scripts, as ConfigMaps.
#
# Generated by deploy/kubernetes/generate-config.sh from the files in the repository. Do not edit
# by hand: run the script again instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: doc-config
  namespace: doc-system
data:
  doc.toml: |
    # DOC platform configuration. Secrets belong in the secrets volume or environment variables,
    # never here. Environment variables override these values (see docs and `.env.example`).
    
    [server]
    http_addr = "0.0.0.0:8080"
    quic_addr = "0.0.0.0:4433"
    
    [database]
    # Overridden by DOC_DATABASE_URL / DOC_MIGRATION_DATABASE_URL / DOC_PLUGINS_DATABASE_URL.
    url = "postgres://doc_app:dev-only-change-me@127.0.0.1:5432/doc"
    migration_url = "postgres://doc_owner:dev-only-change-me@127.0.0.1:5432/doc"
    # Plugins' collections (T62), in a database of their own that only the backend connects to.
    plugins_url = "postgres://doc_data:dev-only-change-me@127.0.0.1:5432/doc_plugins"
    
    [secrets]
    dir = "/secrets"
    
    [bootstrap]
    # Logins that get plugin:core:user:rw before the RBAC plugin runs. The bootstrap job writes a
    # one-time password for a DOC account named after the first to `first-sign-in` in the secrets
    # volume, for the first sign-in.
    admins = ["acolwill"]
    # Service account used by `just` recipes and CI; gets plugin:core:service:ro.
    operator = "operator"
    # Service account the frontend reads the API with; gets plugin:core:service:ro.
    frontend = "frontend"
    
    [fabric]
    # buses - "memory" for in-process; "cluster" for Raft cluster.
    mode = "memory"
    port = 4433
    event_bus = ["eventbus-1", "eventbus-2", "eventbus-3"]
    service_bus = ["servicebus-1", "servicebus-2", "servicebus-3"]
    cache_bus = ["cachebus-1", "cachebus-2", "cachebus-3"]
    
    [plugins]
    # A plugin is put in `error` if this many seconds pass without it reporting liveness.
    liveness_grace_s = 20
    # Development only. A version already seen is normally held to the binary it first registered
    # with; this lets a rebuild register under the same version, so a plugin restarts on every edit.
    # `just dev` and the Docker stack turn it on; override with DOC_PLUGINS_ALLOW_REBUILDS.
    allow_rebuilds = false
    # A forwarded request or a synchronous `run` that takes longer than this answers 504.
    request_deadline_s = 30
    # One attempt at an async plugin's background `run`, and at any background run a plugin of another
    # classification queues for itself. At most 30 seconds.
    async_deadline_s = 30
    # A one-shot plugin's `run` after each load. At most 10 minutes.
    one_shot_deadline_s = 600
    # During a hot reload, requests wait this long for the new version before answering 503...
    handover_timeout_s = 5
    # ...and the old version gets this long to finish the requests it already has.
    drain_timeout_s = 10
    # The plugin probe puts a plugin in `error` ("timed out") once it has been `loading` (migrations
    # included) or `unloading` for this long. A `load` call is abandoned after 60 s on its own.
    stuck_after_s = 90
    ids = [
        "rbac",
        "local",
        "github",
        "ghe",
        # One OpenID Connect plugin per provider: the same binary under a different ID, with its own
        # settings (`DOC_GOOGLE_ISSUER` for `google`) and its own place on the sign-in page. An ID here
        # that nothing runs costs nothing, and one that is missing cannot register at all.
        "oidc",
        "google",
        "entra",
        "akamai",
        "resources",
        "service-map",
        "radar",
        "kb",
        "automation",
        "calendar",
        "calendar-events",
        "process",
        "water",
        "infra",
        "notifications",
        "templates",
        "maturity",
        "flags",
        "dora",
        "cicd",
        "reliability",
        "eol",
        # Jira Cloud, and the same crate built for Data Center and Server as `jira-dc` (ADR-0007 §3).
        "jira",
        "jira-dc",
        "roadmap",
        # Made-up data for the five above, switched on for each on its own Settings page (FIX-FAUX-DATA).
        "faux-data",
        "insights",
        # DOC as the name server for its own domains, forwarding every other name upstream.
        "dns",
        # Clusters read with a read-only service account, feeding DORA, CI/CD/CT and Reliability.
        "kubernetes",
        # Each team's rotas, the holidays its lead records and the gaps they leave, on its calendars.
        "rota",
        # An LLM taking Confluence, Backstage, Jira, Markdown and MkDocs into DOC, staged for approval.
        "vacuum",
        # Credentials kept once for every plugin, and child tokens from vendors DOC is onboarded to.
        "secrets",
        # An agent that uses DOC: one MCP server for your own agent, and jobs DOC runs with Claude.
        "agent",
        "hello",
    ]
    
    # Capabilities are refused unless a plugin is named here (§5). Adding an entry gives that plugin
    # power over the whole platform, so the list is configuration rather than anything a plugin asks for.
    [plugins.capabilities]
    # `offboarding` lets its rules act on somebody an identity provider says has left (T67).
    rbac = ["permission-provider", "offboarding"]
    # DOC accounts: usernames and passwords kept in DOC, for trying it without a company directory.
    local = ["identity-provider", "public-routes"]
    # `team-provider` brings each organisation's GitHub teams and their members into core (T68).
    github = ["identity-provider", "public-routes", "team-provider"]
    ghe = ["identity-provider", "public-routes", "team-provider"]
    # Any OpenID Connect provider: Entra ID, Google, Keycloak, Okta. `just oidc-dev` runs one to try.
    # Each instance is its own plugin, so each needs its own entry here.
    oidc = ["identity-provider", "public-routes"]
    google = ["identity-provider", "public-routes"]
    entra = ["identity-provider", "public-routes"]
    akamai = ["identity-provider", "public-routes"]
    # The Catalogue shows core's organisations and teams rather than keeping its own, and writes them
    # for whoever is asking, who must administer identity themselves (T69).
    resources = ["team-writer"]
    # Each automation's inbound webhook is a public route, checked by its own signature.
    automation = ["public-routes"]
    # Calendar feeds are fetched by calendar apps, with nothing but their secret URL.
    calendar = ["public-routes"]
    # The Data Vacuum mints a scoped token for the administrator starting a run, which lasts minutes
    # and reaches only it (and reads the Knowledge Base, Watercooler and the Catalogue), for their agent.
    vacuum = ["token-issuer"]
    # Secret Storage has core seal and open what it keeps under the settings key, and answers for the
    # secrets other plugins' settings point at (FEAT-SECRETS).
    secrets = ["secret-store"]
    # Agent Smith adds people by email for whoever its call or job acts for, never for itself
    # (FEAT-AGENT); `team-writer` is how a plugin does that. `service-account` gives it one of its own,
    # `agent-smith`, which runbooks run by a schedule, an event or an automation act as. It holds only
    # what administrators grant it in RBAC.
    agent = ["team-writer", "service-account"]
    
    # What the plugins are sorted into: a section each on the Plugins page, in this order, and a pill
    # beside a plugin's name wherever else it is shown. They follow the navigation bar's menus, so a
    # plugin is found under the same name in both: Workspace, Platform and Technology are those menus,
    # and the plugins with no pages of their own — signing in, and the platform's own services and
    # tools — are sorted by what they are for. A plugin in none of them is shown under Other.
    [[plugins.categories]]
    name = "Workspace"
    plugins = [
        "agent",
        "automation",
        "calendar",
        "calendar-events",
        "jira",
        "jira-dc",
        "kb",
        "process",
        "rota",
        "water",
    ]
    
    [[plugins.categories]]
    name = "Platform"
    plugins = [
        "cicd",
        "dns",
        "dora",
        "flags",
        "infra",
        "kubernetes",
        "maturity",
        "reliability",
        "resources",
        "roadmap",
    ]
    
    [[plugins.categories]]
    name = "Technology"
    plugins = ["eol", "insights", "radar", "service-map", "templates"]
    
    [[plugins.categories]]
    name = "Identity"
    plugins = ["akamai", "entra", "ghe", "github", "google", "oidc"]
    
    [[plugins.categories]]
    name = "Core"
    plugins = ["local", "notifications", "rbac", "secrets"]
    
    [[plugins.categories]]
    name = "Tools"
    plugins = ["faux-data", "hello", "vacuum"]
    
    # The environment names that mean production wherever a plugin uses them, compared without case. A
    # call guarded against changing production, such as a runbook Agent Smith runs against development
    # or test, may not change anything in one of these (FEAT-AGENT).
    [environments]
    production = ["production", "prod", "live"]

    # Where this DOC is, which every plugin is given with its settings: pages say https://<domain>
    # where they give DOC's address, and the DNS plugin answers for the domain and names the
    # plugins under it unless its settings say otherwise. The ingress's host. Overridden by
    # DOC_INSTANCE_DOMAIN and DOC_INSTANCE_ADDRESS.
    [instance]
    domain = "rundoc.sh"
    # The address other machines reach DOC at: the load balancer's. Empty is the backend pod's own,
    # which only the cluster can reach.
    address = ""
  doc-frontend.toml: |
    # DOC frontend configuration. Secrets belong in the secrets volume or environment variables,
    # never here. Environment variables override these values (see `.env.example`).
    
    [server]
    # 8081 by default so the frontend and the backend can both run on a developer machine.
    http_addr = "0.0.0.0:8081"
    
    [backend]
    # Overridden by DOC_BACKEND_URL; inside the doc network the host is `backend`.
    base_url = "http://127.0.0.1:8080"
    # Overridden by DOC_BACKEND_TOKEN. Empty means the frontend calls the API unauthenticated;
    # per-user tokens arrive with sessions (T31).
    token = ""
    
    [secrets]
    dir = "/secrets"
    
    [instance]
    # Shown before the logo, so "DEV" reads as DEV[DOC]. Overridden by DOC_INSTANCE_NAME.
    # Empty shows the rundoc logo on its own instead. This is the name used until an administrator sets one for the
    # whole platform in Admin > Settings, which every frontend then shows.
    name = ""
    
    [dev]
    # Serves /dev/boot and makes every page poll it, so a rebuilt frontend reloads the open tab.
    # `just dev` turns this on with DOC_DEV_RELOAD; leave it off everywhere else.
    reload = false
    
    [fabric]
    # "memory" runs the buses in-process; "cluster" uses the Event Bus and Cache Bus clusters.
    mode = "memory"
    port = 4433
    event_bus = ["eventbus-1", "eventbus-2", "eventbus-3"]
    cache_bus = ["cachebus-1", "cachebus-2", "cachebus-3"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: doc-system
data:
  10-doc-roles.sh: |
    #!/bin/bash
    # Creates the owner role (migrations) and the application role (runtime).
    set -euo pipefail
    
    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" --dbname "$DOC_DB" \
      -v db="$DOC_DB" \
      -v owner="$DOC_OWNER_USER" -v owner_password="$DOC_OWNER_PASSWORD" \
      -v app="$DOC_APP_USER" -v app_password="$DOC_APP_PASSWORD" <<-'EOSQL'
    	CREATE ROLE :"owner" LOGIN PASSWORD :'owner_password';
    	CREATE ROLE :"app" LOGIN PASSWORD :'app_password';
    
    	ALTER DATABASE :"db" OWNER TO :"owner";
    	REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
    	GRANT CONNECT, TEMPORARY ON DATABASE :"db" TO :"owner", :"app";
    
    	REVOKE ALL ON SCHEMA public FROM PUBLIC;
    	CREATE SCHEMA core AUTHORIZATION :"owner";
    	CREATE SCHEMA core_v1 AUTHORIZATION :"owner";
    	GRANT USAGE ON SCHEMA core TO :"app";
    	GRANT USAGE ON SCHEMA core_v1 TO :"app";
    
    	ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA core
    	  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app";
    	ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA core
    	  GRANT USAGE, SELECT ON SEQUENCES TO :"app";
    	ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA core_v1
    	  GRANT SELECT ON TABLES TO :"app";
    EOSQL
  20-doc-plugins.sh: |
    #!/bin/bash
    # Creates the database plugins' collections live in (T62) and the role the backend keeps them with.
    # Safe to run again: the storage stack's setup service does, for databases made before T62.
    set -euo pipefail
    
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v data="$DOC_DATA_USER" -v data_password="$DOC_DATA_PASSWORD" -v db="$DOC_PLUGINS_DB" <<-'EOSQL'
    	SELECT format('CREATE ROLE %I LOGIN', :'data')
    	WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'data') \gexec
    	SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'data', :'data_password') \gexec
    	SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'data')
    	WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db') \gexec
    	SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db') \gexec
    EOSQL
