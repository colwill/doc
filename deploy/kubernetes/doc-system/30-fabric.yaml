apiVersion: v1
kind: Service
metadata:
  name: telemetry
  namespace: doc-system
spec:
  selector:
    app.kubernetes.io/name: telemetry
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  namespace: doc-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry
        app.kubernetes.io/part-of: doc
    spec:
      containers:
        - name: telemetry
          image: grafana/otel-lgtm:0.29.0
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
