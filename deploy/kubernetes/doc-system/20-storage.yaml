# Postgres, and the volume every part of the platform reads its certificates and tokens from.
#
# `doc-secrets` is ReadWriteMany because the bootstrap Job writes it once and the backend, the
# frontend, the workers, all nine bus nodes and every plugin then read it at the same time, across
# nodes. A cluster whose storage class cannot do RWX needs one that can (NFS, CephFS, Azure Files,
# EFS) or the secrets loaded as a Kubernetes Secret instead — see the README.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doc-secrets
  namespace: doc-system
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: doc-system
type: Opaque
stringData:
  # Change every one of these before this goes anywhere real.
  POSTGRES_PASSWORD: dev-only-change-me
  DOC_OWNER_PASSWORD: dev-only-change-me
  DOC_APP_PASSWORD: dev-only-change-me
  DOC_DATA_PASSWORD: dev-only-change-me
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: doc-system
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: doc-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: doc
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: doc
            - name: DOC_DB
              value: doc
            - name: DOC_OWNER_USER
              value: doc_owner
            - name: DOC_APP_USER
              value: doc_app
            - name: DOC_PLUGINS_DB
              value: doc_plugins
            - name: DOC_DATA_USER
              value: doc_data
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0o755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
