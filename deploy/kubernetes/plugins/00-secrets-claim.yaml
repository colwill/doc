# The plugins read the same secrets the bootstrap Job filled in doc-system. A PersistentVolumeClaim
# does not cross namespaces, so this one binds the same underlying volume by name.
#
# Fill in `volumeName` with the PersistentVolume that doc-system/doc-secrets bound to:
#   kubectl -n doc-system get pvc doc-secrets -o jsonpath='{.spec.volumeName}'
# On a cluster whose storage cannot share one volume across namespaces, copy the secrets into a
# Kubernetes Secret instead and mount that — see the README.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doc-secrets
  namespace: doc-plugins
spec:
  accessModes: [ReadWriteMany]
  # volumeName: pvc-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  resources:
    requests:
      storage: 64Mi
