# The secrets plugin: a deployment and a service of its own, connected to doc-system.
#
# The service is what the backend dials back on, so `DOC_PLUGIN_ADVERTISE` is that service's name.
# The plugin reads its registration token and certificate from the same secrets volume the
# bootstrap Job filled, which is why this namespace mounts the claim from doc-system.
#
# It also holds a **second listener of its own** for the vendor proxy (ADR-0014), on TCP 8460.
# That one is not core's: callers reach it directly, because a clone or an artifact must not go
# through the 16 MB cap on a plugin call. It answers nothing until the `proxy` feature is on.
apiVersion: v1
kind: Service
metadata:
  name: secrets
  namespace: doc-plugins
  labels:
    app.kubernetes.io/name: secrets
    app.kubernetes.io/part-of: doc
spec:
  selector:
    app.kubernetes.io/name: secrets
  ports:
    - name: quic
      port: 4440
      protocol: UDP
      targetPort: 4440
    - name: proxy
      port: 8460
      protocol: TCP
      targetPort: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets
  namespace: doc-plugins
  labels:
    app.kubernetes.io/name: secrets
    app.kubernetes.io/part-of: doc
spec:
  # One: a plugin registers as itself, and a second copy of the same version would hand over to
  # the first rather than share the work.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets
        app.kubernetes.io/part-of: doc
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: secrets
          image: doc/secrets:dev
          ports:
            - name: quic
              containerPort: 4440
              protocol: UDP
            # The vendor proxy's own listener. Nothing answers until the `proxy` feature is on,
            # and its port is the `proxy-port` setting.
            - name: proxy
              containerPort: 8460
              protocol: TCP
          env:
            - name: DOC_SECRETS_DIR
              value: /secrets
            - name: DOC_BACKEND_QUIC
              value: backend.doc-system.svc.cluster.local:4433
            - name: DOC_PLUGIN_BIND
              value: 0.0.0.0:4440
            - name: DOC_PLUGIN_ADVERTISE
              value: secrets.doc-plugins.svc.cluster.local:4440
            - name: RUST_LOG
              value: info,quiche=warn,tokio_quiche=warn
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://telemetry.doc-system.svc.cluster.local:4318
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          resources:
            # Bytes in flight are what the proxy costs, not CPU: a deployment proxying clones and
            # artifacts raises the memory limit and gives this its own nodes (ADR-0014 §10).
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: secrets
          persistentVolumeClaim:
            claimName: doc-secrets
---
# What callers address for a proxied vendor account: `https://proxy.rundoc.sh/via/<account>/<path>`
# with their DOC key as a bearer token. The rule lives here rather than in doc-system's Ingress
# because an Ingress can only name a Service in its own namespace.
#
# TLS terminates here, and the hop to the plugin is inside the cluster. A deployment that wants it
# encrypted the whole way gives the plugin a certificate and points the ingress at HTTPS instead.
#
# Two annotations matter, and their names differ by ingress controller — these are ingress-nginx's:
# a clone or an artifact is large and slow, so neither a body size limit nor a short read timeout
# can be left at its default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secrets-proxy
  namespace: doc-plugins
  labels:
    app.kubernetes.io/name: secrets
    app.kubernetes.io/part-of: doc
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: proxy.rundoc.sh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secrets
                port:
                  number: 8460
