# `cargo deny check advisories licenses`, which `just check` runs: every crate in the build must be
# free of RustSec advisories and under a licence on this list.

[graph]
all-features = true

[advisories]
# An advisory is only ignored here with the reason it cannot apply to DOC.
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained, not vulnerable; only quiche's qlog reaches it, through foundations' settings, and DOC gives it no YAML" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

# DOC's own crates are not published, so they need no licence of their own.
[licenses.private]
ignore = true
